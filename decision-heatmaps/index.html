    'repos with 0 commits: ' + ok.filter(r => !r.total).map(r => r.repo).join(', ') || 'нет'
  ]));
  app.appendChild(s);
}

/* 2. Handoff flow by tier */
{
  const h = D.handoffs || {};
  const flow = h.flow || {};
  const rows = Object.keys(flow).map(t => ({ repo: t, weeks: flow[t] }));
  rows.sort((a, b) => b.weeks.reduce((x, y) => x + y, 0) - a.weeks.reduce((x, y) => x + y, 0));
  const s = section('2. Поток хендоффов — мятые × тип × неделя',
    `всего в реестре: ${(h.counts || {}).total || '?'} · очередь: ${(h.counts || {}).queued || '?'} · в работе: ${(h.counts || {}).in_work || '?'} · старше окна: ${h.flow_older || 0}`);
  s.appendChild(hmap(labels, rows, { val: r => r.weeks, rowname: r => r.repo, total: true }));
  s.appendChild(trustBlock([
    'источник: handoff_queue_dashboard/queue.js (tools/build_handoff_queue_dashboard.py, срез ' + esc(h.generated || '?') + ')',
    'дата закрытия в реестре не хранится — heatmap показывает МИНТЫ; close-flow отдельная работа',
    'последняя колонка — текущая (неполная) неделя'
  ]));
  app.appendChild(s);
}

/* 3. Backlog repo x tier */
{
  const b = (D.handoffs || {}).backlog || {};
  const tiers = [...new Set(Object.values(b).flatMap(o => Object.keys(o)))];
  const repos = Object.keys(b).map(repo => {
    const row = { repo, weeks: tiers.map(t => b[repo][t] || 0) };
    row._total = row.weeks.reduce((a, c) => a + c, 0);
    return row;
  }).sort((a, c) => c._total - a._total).slice(0, 15);
  const s = section('3. Открытый бэклог хендоффов — репо × тип',
    'in_work + queued · топ-15 репозиториев · это твоя очередь решений, сгруппированная по месту работы');
  const t = hmap(tiers, repos, { val: r => r.weeks, rowname: r => r.repo, total: true });
  s.appendChild(t);
  s.appendChild(trustBlock([
    'источник: queue.js, buckets in_work|queued',
    'репо из поля handoff-файла — возможен мусор (см. coverage_dashboard README: «Repo column contains occasional garbage»)'
  ]));
  app.appendChild(s);
}

/* 4. GTD aging */
{
  const g = D.gtd || {};
  const buckets = g.buckets || [];
  const rows = Object.keys(g.aging || {}).map(tok => ({ repo: tok, weeks: buckets.map(b => g.aging[tok][b] || 0) }));
  const s = section('4. GTD — очередь твоих решений по возрасту',
    `якорь: ${esc(g.anchor || '?')} · undated = строки до правила «GTD rows carry dates» (04-09-2026)`);
  s.appendChild(hmap(buckets, rows, { val: r => r.weeks, rowname: r => r.repo, total: true }));
  s.appendChild(trustBlock([
    'источник: GTD_NEXT_ACTIONS.md, парс токенов @DECIDE/@DO/@WAITING',
    'дата строки = полная dd-mm-yyyy где есть, иначе последняя dd-mm ячейка (последнее касание) — смешанная семантика, помечено честно',
    '61d+ строки — кандидаты на архивацию/переформулировку'
  ]));
  app.appendChild(s);
}

/* 5. Repo health */
{
  const hl = D.health || {};
  const repos = (hl.repos || []).slice().sort((a, b) => (b.ruff_per_10k || 0) - (a.ruff_per_10k || 0)).slice(0, 25);
  const s = section('5. Где гниль — дефекты и тесты × репо',
    `${hl.n || 0} репо в census от ${esc((hl.generated || '').slice(0, 10))} · ниже худшие 25 по дефектам на 10k строк`);
  const rowsHtml = repos.map(r => {
    const tr = document.createElement('tr');
    [r.repo, r.owner, r.loc, r.ruff_total, r.ruff_per_10k,
     (r.test_ratio == null ? '—' : (r.test_ratio * 100).toFixed(1) + '%'),
     r.last_commit, r.commits_90d, r.has_ci ? '✓' : '✗'
    ].forEach((v, i) => {
      const td = document.createElement('td'); td.textContent = v;
      if (i > 1) td.className = 'num';
      if (i === 4 && v > 50) td.classList.add('warn');
      if (i === 5 && v !== '—' && parseFloat(v) === 0) td.classList.add('warn');
      tr.appendChild(td);
    });
    return tr;
  });
  s.appendChild(table(['repo', 'owner', 'loc', 'ruff', 'ruff/10k', 'tests', 'last commit', 'commits 90d', 'CI'], rowsHtml));
  s.appendChild(trustBlock([
    'источник: data/code_smell_census (scanner v' + esc('1.0.0') + ', ruff F,E7,E9,B,…)',
    'ruff/10k ≥ 50 или tests = 0 подсвечены как кандидаты на ремонт',
    'score из census не использован — только измеримые поля'
  ]));
  app.appendChild(s);
}
</script>
</body>
</html>
