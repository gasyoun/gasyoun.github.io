name: Vote sheet staleness check

# Flags any live vote/sheets/*.html whose csl-pyutil generator meta tag is
# missing or behind the latest sanskrit-lexicon/csl-pyutil release. Public
# GitHub API only — no secrets/tokens needed.
#
# Part of H2854 step 5 (vote-platform build, tracked in Uprava). See
# scripts/check_sheet_staleness.py for the exclusion list (frozen/archived
# sheets) and Uprava/docs/ARCHITECTURE_UPRAVA_VOTE_PLATFORM.md ("CI-чек
# устаревания") for the contract.

on:
  push:
    paths:
      - "vote/sheets/**"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  check-staleness:
    name: Check sheet staleness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run staleness check
        run: python scripts/check_sheet_staleness.py
