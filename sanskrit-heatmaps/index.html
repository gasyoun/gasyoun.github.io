const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function color(v, max) {
  if (!v) return 'background:#1d2634';
  const a = 0.12 + 0.88 * Math.sqrt(v / max);
  return 'background:rgba(224,85,85,' + a.toFixed(3) + ')';
}
function hmap(labels, rows, opts) {
  opts = opts || {};
  const max = Math.max(1, ...rows.flatMap(r => opts.val(r).map(Number)));
  const t = document.createElement('table'); t.className = 'hmap';
  const hr = document.createElement('tr'); hr.appendChild(document.createElement('th'));
  labels.forEach((l, i) => {
    const th = document.createElement('th');
    th.textContent = l.length > 12 ? l.slice(0, 11) + '…' : l;
    th.style.fontSize = '9px'; th.title = l; hr.appendChild(th);
  });
  const tt = document.createElement('th'); tt.textContent = opts.totalLabel || 'Σ'; hr.appendChild(tt);
  t.appendChild(hr);
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const td = document.createElement('td'); td.className = 'lbl'; td.title = opts.rowtitle ? opts.rowtitle(r) : ''; tr.appendChild(td);
    td.textContent = opts.rowname(r);
    const vals = opts.val(r);
    vals.forEach((v, i) => {
      const c = document.createElement('td'); c.className = 'num';
      const s = document.createElement('span'); s.className = 'cell';
      s.style.cssText = color(Number(v), max);
      if (opts.mark && opts.mark(r, i, Number(v))) s.classList.add('gold');
      s.title = opts.rowname(r) + ' · ' + labels[i] + ' · ' + v;
      c.appendChild(s); tr.appendChild(c);
    });
    const t2 = document.createElement('td'); t2.className = 'num'; t2.style.fontWeight = '700';
    t2.textContent = opts.total(r) != null ? opts.total(r) : vals.reduce((a, b) => a + Number(b || 0), 0);
    tr.appendChild(t2);
    t.appendChild(tr);
  });
  return t;
}
function trustBlock(items) {

}
function section(title, note) {

}

{
