<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifier queue — pick a lane that may verify — decision tree</title>
<style>
:root { --ink:#1a1a2e; --accent:#16537e; --ok:#0b6e4f; --muted:#6b7280; --bg:#f6f7f9; }
* { box-sizing:border-box; }
body { font:16px/1.55 Georgia,'Times New Roman',serif; color:var(--ink); background:var(--bg); margin:0; padding:2rem 1rem; }
main { max-width:44rem; margin:0 auto; }
h1 { font-size:1.35rem; margin:0 0 .25rem; }
.src { color:var(--muted); font-size:.85rem; margin-bottom:1.25rem; }
.crumbs { font-size:.85rem; color:var(--muted); min-height:1.2em; margin-bottom:.75rem; }
.card { background:#fff; border:1px solid #d6d9de; border-radius:10px; padding:1.1rem 1.25rem; }
.card h2 { font-size:1.05rem; margin:.1rem 0 .8rem; }
.opt { display:block; width:100%; text-align:left; margin:.45rem 0; padding:.6rem .8rem; font:inherit;
        background:#eef3f8; border:1px solid #c6d4e2; border-radius:8px; cursor:pointer; }
.opt:hover { background:#dfeaf4; }
.opt.chosen { background:#e6f2ec; border-color:var(--ok); }
.terminal { border-left:4px solid var(--ok); }
.terminal .act { font-weight:bold; }
.note { color:var(--muted); font-size:.9rem; margin-top:.7rem; }
.path { margin-top:1.25rem; }
.path h2 { font-size:.95rem; color:var(--muted); }
.path ol { margin:.2rem 0; padding-left:1.2rem; }
button#restart { margin-top:1rem; font:inherit; padding:.45rem .9rem; border-radius:8px;
                  border:1px solid #c6d4e2; background:#fff; cursor:pointer; }
@media print { .opt, #restart { display:none; } .path { display:block; } }
</style>
</head>
<body>
<main>
<h1>Verifier queue — pick a lane that may verify</h1>
<p class="src">Source of truth: <a href="https://github.com/gasyoun/claude-config/blob/main/commands/hverify.md">https://github.com/gasyoun/claude-config/blob/main/commands/hverify.md</a> · generated from <code>trees/hverify-lane.yaml</code> — regenerate, never hand-edit.</p>
<div id="crumbs" class="crumbs"></div>
<div id="card" class="card"></div>
<div id="path" class="path"><h2>Your path</h2><ol id="pathlist"></ol></div>
<button id="restart" type="button">Start over</button>
</main>
<script>
"use strict";
var DATA = {"tree": "hverify-lane", "title": "Verifier queue — pick a lane that may verify", "source": "https://github.com/gasyoun/claude-config/blob/main/commands/hverify.md", "root": "q-family", "nodes": {"q-family": {"question": "What does the nightly digest (BOARD_DIGEST s5 dead-lane table) show for a DIFFERENT-family verifier of your executor family?", "terminal": false, "action": null, "link": null, "note": "An executor family never verifies its own closes (H4430) — a second session of the same model is still the executor.", "options": [{"label": "OxAlpha executor — DeepSeek verifier lane alive", "next": "q-money"}, {"label": "DeepSeek executor — OxAlpha verifier lane alive", "next": "q-money"}, {"label": "Only same-family lanes alive", "next": "t-same-family"}]}, "q-money": {"question": "Are any money-class rows in the queue?", "terminal": false, "action": null, "link": null, "note": null, "options": [{"label": "Yes — money rows present", "next": "t-money-human"}, {"label": "No — no money rows", "next": "q-cap"}]}, "q-cap": {"question": "Is the queue size over 25?", "terminal": false, "action": null, "link": null, "note": null, "options": [{"label": "Yes — cap alert", "next": "t-cap-alert"}, {"label": "No — within cap", "next": "t-launch"}]}, "t-same-family": {"question": null, "terminal": true, "action": "REFUSE the lane — different-model sweep or nothing. Park the queue rather than let the executor bless its own work.", "link": "https://github.com/gasyoun/claude-config/blob/main/commands/hverify.md", "note": null, "options": []}, "t-money-human": {"question": null, "terminal": true, "action": "Money-class rows are human-gated to MG — sweep everything else, present the money rows with evidence, never auto-close them.", "link": "https://github.com/gasyoun/claude-config/blob/main/commands/hverify.md", "note": null, "options": []}, "t-cap-alert": {"question": null, "terminal": true, "action": "Cap alert (>25) — drain in bounded batches per digest guidance, not one unbounded sweep.", "link": "https://github.com/gasyoun/claude-config/blob/main/commands/hverify.md", "note": null, "options": []}, "t-launch": {"question": null, "terminal": true, "action": "Launch via Uprava tools/class_verifier_launch.py (preflight, launch, harvest, land) — or handoff_close.py H", "link": "https://github.com/gasyoun/Uprava/blob/main/tools/class_verifier_launch.py", "note": null, "options": []}}};
var path = [];
function el(id) { return document.getElementById(id); }
function show(nid) {
  var n = DATA.nodes[nid];
  var crumbs = path.map(function (p) { return esc(p.label); }).join(' &rarr; ');
  el('crumbs').innerHTML = crumbs;
  var card = el('card');
  card.className = 'card' + (n.terminal ? ' terminal' : '');
  if (n.terminal) {
    card.innerHTML = '<h2>Result</h2><p class="act">' + esc(n.action || '') + '</p>'
      + (n.link ? '<p><a href="' + esc(n.link) + '">' + esc(n.link) + '</a></p>' : '')
      + (n.note ? '<p class="note">' + esc(n.note) + '</p>' : '');
  } else {
    var btns = n.options.map(function (o, i) {
      return '<button class="opt" type="button" data-i="' + i + '">' + esc(o.label) + '</button>';
    }).join('');
    card.innerHTML = '<h2>' + esc(n.question) + '</h2>' + btns
      + (n.note ? '<p class="note">' + esc(n.note) + '</p>' : '');
    Array.prototype.forEach.call(card.querySelectorAll('.opt'), function (b) {
      b.addEventListener('click', function () {
        var o = n.options[Number(b.getAttribute('data-i'))];
        path.push({ label: o.label, from: nid });
        Array.prototype.forEach.call(card.querySelectorAll('.opt'), function (x) {
          if (x !== b) { x.classList.add('chosen'); } else { x.classList.add('chosen'); }
        });
        drawPath();
        show(o.next);
      });
    });
  }
}
function drawPath() {
  el('pathlist').innerHTML = path.map(function (p) { return '<li>' + esc(p.label) + '</li>'; }).join('');
}
el('restart').addEventListener('click', function () { path = []; drawPath(); el('crumbs').innerHTML = ''; show(DATA.root); });
show(DATA.root);
</script>
</body>
</html>
