<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<!-- Layout: blueprint technical drawing, Telegram story 1080x1920 (9:16).
     Building heights: entries x 0.0022335 px (MW 286 525 -> 640px).
     MW share = 286525/1506452 = 19.0% -> gauge in the MW label. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --canvas-w: 1080px; --canvas-h: 1920px;
  --bp:#0E3A66; --bp-deep:#0A2E53;
  --line:#EAF4FF; --line-soft:rgba(234,244,255,.55); --line-dim:rgba(234,244,255,.30);
  --text:#F4F9FF; --text-sub:#C7DDF2;
  --accent:#FF8A70;
  --font-display:'Comfortaa',sans-serif; --font-body:'Nunito',sans-serif;
}
html, body { background: var(--bp-deep); }
body { width: var(--canvas-w); font-family: var(--font-body); color: var(--text); }
.canvas { position: relative; width: var(--canvas-w); height: var(--canvas-h); overflow: hidden;
  background: radial-gradient(ellipse 900px 1300px at 50% 34%, #12406F 0%, var(--bp) 58%, var(--bp-deep) 100%); }
.scene { position: absolute; inset: 0; }
.kicker { position: absolute; left: 64px; right: 64px; top: 148px;
  font: 800 15px/1.3 var(--font-body); text-transform: uppercase; letter-spacing: .14em; color: var(--text-sub); }
h1 { position: absolute; left: 64px; top: 186px; width: 900px;
  font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 1.12; color: var(--text); }
.hero { position: absolute; left: 64px; top: 348px; }
.hero-num { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 1; letter-spacing: -.01em; color: #FFFFFF; }
.hero-label { margin-top: 14px; font: 600 25px/1.35 var(--font-body); color: var(--text); }
.hero-sub { margin-top: 6px; font: 600 17px/1.3 var(--font-body); color: var(--text-sub); }
.hero-bar { margin-top: 16px; width: 120px; height: 8px; background: var(--accent); }
.lang { position: absolute; top: 148px; right: 40px; background: transparent; border: 2px solid var(--line-soft);
  border-radius: 6px; padding: 5px 12px; font: 800 13px/1 var(--font-body); color: var(--text); text-decoration: none; }
svg text { font-family: var(--font-body); }
.bp-name { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--text-sub); }
.bp-val { font-size: 36px; font-weight: 700; fill: #FFFFFF; font-family: var(--font-display); }
.bp-cap { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; fill: var(--text-sub); }
.bp-dim { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; fill: var(--line-soft); }
.bp-big { font-size: 30px; font-weight: 700; fill: #FFFFFF; font-family: var(--font-display); letter-spacing: .02em; }
.bp-src { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; fill: var(--text-sub); }

/* ===== motion: the drawing draws itself ===== */
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fadeup { opacity: 0; animation: fadeup .5s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.fade { opacity: 0; animation: fadein .5s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.growx { transform: scaleX(0); transform-origin: left center; animation: growx .6s ease-out forwards; }
@keyframes growx { to { transform: scaleX(1); } }
.pop { opacity: 0; transform: scale(.6); transform-box: fill-box; transform-origin: center;
  animation: pop .55s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes pop { to { opacity: 1; transform: scale(1); } }
.kicker { animation: fadeup .5s ease-out backwards; animation-delay: .1s; }
h1 { animation: fadeup .6s ease-out backwards; animation-delay: .2s; }
.hero-num { animation: fadeup .6s ease-out backwards; animation-delay: .35s; }
.hero-label { animation: fadeup .5s ease-out backwards; animation-delay: .5s; }
.hero-sub { animation: fadeup .5s ease-out backwards; animation-delay: .6s; }
.hero-bar { transform-origin: left center; animation: growx .6s ease-out backwards; animation-delay: .7s; }
</style>
</head>
