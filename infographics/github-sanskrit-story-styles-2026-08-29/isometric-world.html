<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сколько слов в санскрите? — остров</title>
<!-- Style: floating isometric world at night. Telegram story 1080x1920. RU-only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --night-1:#0E1430; --night-2:#1B2C55; --panel:rgba(13,20,42,.78);
  --neon:#6FE3C1; --neon-2:#7AA8FF; --accent:#FF8A70;
  --text:#EFF4FF; --text-sub:#9FB2D8;
  --font-display:'Comfortaa',sans-serif; --font-body:'Nunito',sans-serif;
}
html, body { background: var(--night-1); }
body { width: 1080px; font-family: var(--font-body); color: var(--text); }
.canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: radial-gradient(ellipse 1000px 1500px at 50% 30%, var(--night-2) 0%, var(--night-1) 68%); }
.scene { position: absolute; inset: 0; }
.kicker { position: absolute; left: 64px; top: 120px; font: 800 14px/1.3 var(--font-body);
  text-transform: uppercase; letter-spacing: .16em; color: var(--text-sub); }
h1 { position: absolute; left: 64px; top: 154px; width: 880px; font-family: var(--font-display);
  font-weight: 700; font-size: 62px; line-height: 1.1; color: var(--text); }
.hero { position: absolute; left: 64px; top: 352px; }
.hero-num { font-family: var(--font-display); font-weight: 700; font-size: 78px; line-height: 1; color: #FFFFFF; }
.hero-label { margin-top: 10px; font: 600 22px/1.3 var(--font-body); }
.hero-sub { margin-top: 4px; font: 600 16px/1.3 var(--font-body); color: var(--text-sub); }
svg text { font-family: var(--font-body); }
.w-val { font: 700 21px var(--font-display); fill: var(--text); }
.w-name { font: 800 10.5px var(--font-body); letter-spacing: .08em; text-transform: uppercase; fill: var(--text-sub); }
.w-cap { font: 800 13px var(--font-body); letter-spacing: .12em; text-transform: uppercase; fill: var(--text-sub); }
.bld { opacity: 0; transform: translateY(46px); transform-box: fill-box;
  animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }
.fadeup { opacity: 0; animation: fadeup .5s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.fade { opacity: 0; animation: fadein .6s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.kicker { animation: fadeup .5s ease-out backwards .1s; }
h1 { animation: fadeup .6s ease-out backwards .2s; }
.hero-num { animation: fadeup .6s ease-out backwards .35s; }
.hero-label { animation: fadeup .5s ease-out backwards .5s; }
.hero-sub { animation: fadeup .5s ease-out backwards .6s; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="scene" viewBox="0 0 1080 1920" width="1080" height="1920">
    <!-- stars -->
    <g fill="#DCE7FF">
      <g class="fade" style="animation-delay:.3s">
        <circle cx="130" cy="560" r="3"/><circle cx="240" cy="470" r="2"/><circle cx="360" cy="620" r="2.5"/>
        <circle cx="520" cy="540" r="2"/><circle cx="700" cy="480" r="3"/><circle cx="860" cy="560" r="2"/>
        <circle cx="960" cy="430" r="2.5"/><circle cx="90" cy="760" r="2"/><circle cx="1000" cy="700" r="2"/>
        <circle cx="180" cy="300" r="2.5"/><circle cx="920" cy="260" r="2"/><circle cx="560" cy="380" r="2"/>
      </g>
      <g class="fade" style="animation-delay:.5s">
        <circle cx="300" cy="720" r="2"/><circle cx="820" cy="760" r="2.5"/><circle cx="640" cy="700" r="2"/>
        <circle cx="60" cy="960" r="2"/><circle cx="1020" cy="900" r="2"/><circle cx="420" cy="820" r="1.8"/>
      </g>
    </g>
    <!-- moon -->
    <g class="fade" style="animation-delay:.4s">
      <circle cx="890" cy="200" r="64" fill="#F4F0E2" opacity=".95"/>
      <circle cx="868" cy="184" r="10" fill="#DCD6C2"/><circle cx="906" cy="214" r="7" fill="#DCD6C2"/>
      <circle cx="890" cy="200" r="86" fill="none" stroke="rgba(244,240,226,.25)" stroke-width="2"/>
    </g>

    <!-- orbit -->
    <g class="fade" style="animation-delay:1.4s">
      <ellipse cx="540" cy="1330" rx="500" ry="140" fill="none" stroke="rgba(159,178,216,.35)" stroke-width="2" stroke-dasharray="3 14"/>
      <circle cx="1040" cy="1330" r="10" fill="var(--accent)"/>
    </g>

    <!-- ===== floating island ===== -->
    <g class="fade" style="animation-delay:.8s">
      <polygon points="110,1258 540,1506 540,1660 110,1412" fill="#131C38"/>
      <polygon points="970,1258 540,1506 540,1660 970,1412" fill="#0C1329"/>
      <polygon points="540,1660 540,1710 480,1690 500,1668" fill="#0C1329"/>
      <polygon points="540,1010 970,1258 540,1506 110,1258" fill="#22335F" stroke="var(--neon)" stroke-width="2.5"/>
      <polygon points="110,1258 540,1506 540,1546 110,1298" fill="#182448" opacity=".9"/>
    </g>

    <!-- ===== five blocks on the island (center row, base y 1300) ===== -->
    <!-- MW h258 x250 -->
    <g class="bld" style="animation-delay:1s">
      <polygon points="250,996 290,1019 250,1042 210,1019" fill="#8FF0D4"/>
      <polygon points="290,1019 250,1042 250,1300 290,1277" fill="#2F8F79"/>
      <polygon points="210,1019 250,1042 250,1300 210,1277" fill="#1C5F51"/>
    </g>
    <!-- PW h154 x390 -->
    <g class="bld" style="animation-delay:1.12s">
      <polygon points="390,1100 430,1123 390,1146 350,1123" fill="#8FF0D4"/>
      <polygon points="430,1123 390,1146 390,1300 430,1277" fill="#2F8F79"/>
      <polygon points="350,1123 390,1146 390,1300 350,1277" fill="#1C5F51"/>
    </g>
    <!-- PWG h111 x530 -->
    <g class="bld" style="animation-delay:1.24s">
      <polygon points="530,1143 570,1166 530,1189 490,1166" fill="#8FF0D4"/>
      <polygon points="570,1166 530,1189 530,1300 570,1277" fill="#2F8F79"/>
      <polygon points="490,1166 530,1189 530,1300 490,1277" fill="#1C5F51"/>
    </g>
    <!-- AP h82 x670 -->
    <g class="bld" style="animation-delay:1.36s">
      <polygon points="670,1172 710,1195 670,1218 630,1195" fill="#8FF0D4"/>
      <polygon points="710,1195 670,1218 670,1300 710,1277" fill="#2F8F79"/>
      <polygon points="630,1195 670,1218 670,1300 630,1277" fill="#1C5F51"/>
    </g>
    <!-- VCP h45 x810 -->
    <g class="bld" style="animation-delay:1.48s">
      <polygon points="810,1209 850,1232 810,1255 770,1232" fill="#8FF0D4"/>
      <polygon points="850,1232 810,1255 810,1300 850,1277" fill="#2F8F79"/>
      <polygon points="770,1232 810,1255 810,1300 770,1277" fill="#1C5F51"/>
    </g>

    <!-- tags -->
    <g class="fadeup" style="animation-delay:1.6s">
      <line x1="250" y1="938" x2="250" y2="992" stroke="var(--neon)" stroke-width="2"/>
      <text x="250" y="904" text-anchor="middle" class="w-val">286 525</text>
      <text x="250" y="926" text-anchor="middle" class="w-name">Monier-Williams</text>
    </g>
    <g class="fadeup" style="animation-delay:1.7s">
      <line x1="390" y1="1042" x2="390" y2="1096" stroke="var(--neon)" stroke-width="2"/>
      <text x="390" y="1008" text-anchor="middle" class="w-val" style="font-size:17px">170 556</text>
      <text x="390" y="1030" text-anchor="middle" class="w-name">Малый Петербургский словарь</text>
    </g>
    <g class="fadeup" style="animation-delay:1.8s">
      <line x1="530" y1="1085" x2="530" y2="1139" stroke="var(--neon)" stroke-width="2"/>
      <text x="530" y="1051" text-anchor="middle" class="w-val" style="font-size:16px">123 366</text>
      <text x="530" y="1073" text-anchor="middle" class="w-name">Большой Петербургский словарь</text>
    </g>
    <g class="fadeup" style="animation-delay:1.9s">
      <line x1="670" y1="1114" x2="670" y2="1168" stroke="var(--neon)" stroke-width="2"/>
      <text x="670" y="1080" text-anchor="middle" class="w-val" style="font-size:15px">90 847</text>
      <text x="670" y="1102" text-anchor="middle" class="w-name">Apte Practical (rev.)</text>
    </g>
    <g class="fadeup" style="animation-delay:2s">
      <line x1="810" y1="1151" x2="810" y2="1205" stroke="var(--neon)" stroke-width="2"/>
      <text x="810" y="1117" text-anchor="middle" class="w-val" style="font-size:15px">50 135</text>
      <text x="810" y="1139" text-anchor="middle" class="w-name">vcp</text>
    </g>
    <!-- share badge on the empty left of the island -->
    <g class="fadeup" style="animation-delay:2.1s">
      <circle cx="160" cy="1330" r="52" fill="var(--panel)" stroke="var(--accent)" stroke-width="3"/>
      <text x="160" y="1324" text-anchor="middle" class="w-val" fill="var(--accent)" style="font-size:19px">19,0 %</text>
      <text x="160" y="1348" text-anchor="middle" class="w-name" style="font-size:9.5px">всех статей</text>
      <line x1="206" y1="1352" x2="214" y2="1312" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 5"/>
    </g>

    <!-- ===== bottom panel ===== -->
    <g class="fadeup" style="animation-delay:2.3s">
      <rect x="64" y="1600" width="952" height="230" rx="18" fill="var(--panel)" stroke="rgba(111,227,193,.4)" stroke-width="2"/>
      <text x="540" y="1672" text-anchor="middle" class="w-cap" style="font-size:12px">остров словарей в океане данных</text>
      <text x="540" y="1738" text-anchor="middle" font-family="Comfortaa" font-weight="700" font-size="44" fill="#FFFFFF">1 506 452</text>
      <a href="https://github.com/sanskrit-lexicon/csl-orig" target="_blank" rel="noopener">
        <text x="300" y="1790" text-anchor="middle" class="w-cap" fill="var(--neon)">↗ 45 словарей · csl-orig</text>
      </a>
      <a href="https://github.com/drdhaval2785/SanskritSpellCheck" target="_blank" rel="noopener">
        <text x="780" y="1790" text-anchor="middle" class="w-cap" fill="var(--neon)">↗ 431 596 заголовков</text>
      </a>
    </g>
  </svg>
  <div class="kicker">Санскритский архив Гасунса · словарный квартал</div>
  <h1>Сколько слов в санскрите?</h1>
  <div class="hero">
    <div class="hero-num">1 506 452</div>
    <div class="hero-label">словарных статей в 45 оцифрованных словарях</div>
    <div class="hero-sub">от кёльнских сканов до связанных данных</div>
  </div>
</div>
</body>
</html>
