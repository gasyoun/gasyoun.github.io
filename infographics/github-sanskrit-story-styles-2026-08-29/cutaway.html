<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сколько слов в санскрите? — разрез</title>
<!-- Style: architectural cutaway. Telegram story 1080x1920. RU-only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper:#F5EFE3; --ink:#29261F; --ink-soft:rgba(41,38,31,.62); --accent:#C4552F;
  --floor:#EAE0CC; --line-dim:rgba(41,38,31,.28);
  --font-head:'Oswald',sans-serif; --font-body:'Nunito',sans-serif;
}
html, body { background: var(--paper); }
body { width: 1080px; font-family: var(--font-body); color: var(--ink); }
.canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
.scene { position: absolute; inset: 0; }
.kicker { position: absolute; left: 64px; top: 118px; font: 600 15px/1.3 var(--font-body);
  text-transform: uppercase; letter-spacing: .16em; color: var(--ink-soft); }
h1 { position: absolute; left: 64px; top: 152px; font-family: var(--font-head); font-weight: 700; font-size: 64px; line-height: 1.05; }
.hero { position: absolute; left: 64px; top: 258px; }
.hero-num { font-family: var(--font-head); font-weight: 700; font-size: 84px; line-height: 1; }
.hero-label { margin-top: 8px; font: 600 23px/1.3 var(--font-body); }
.hero-sub { margin-top: 4px; font: 400 16px/1.35 var(--font-body); color: var(--ink-soft); }
svg text { font-family: var(--font-body); }
.c-name { font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; fill: var(--ink-soft); }
.c-val { font: 700 28px var(--font-head); fill: var(--ink); }
.c-dim { font: 600 13px var(--font-body); letter-spacing: .1em; text-transform: uppercase; fill: var(--ink-soft); }
.floorrow { opacity: 0; animation: fadein .4s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.fadeup { opacity: 0; animation: fadeup .5s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.kicker { animation: fadeup .5s ease-out backwards .1s; }
h1 { animation: fadeup .6s ease-out backwards .2s; }
.hero-num { animation: fadeup .6s ease-out backwards .35s; }
.hero-label { animation: fadeup .5s ease-out backwards .5s; }
.hero-sub { animation: fadeup .5s ease-out backwards .6s; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="scene" viewBox="0 0 1080 1920" width="1080" height="1920">
    <!-- ===== MW cutaway: gable house, section cut, 9 floors ===== -->
    <g class="draw" style="animation-delay:.5s">
      <path d="M 120 1400 V 700 L 330 580 L 540 700 V 1400" pathLength="1" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <g class="draw" style="animation-delay:.7s">
      <path d="M 144 1400 V 714 L 330 606 L 516 714 V 1400" pathLength="1" fill="none" stroke="var(--ink)" stroke-width="2"/>
    </g>
    <g class="fadeup" style="animation-delay:.85s">
      <text x="330" y="540" text-anchor="middle" class="c-name" style="font-size:15px">Monier-Williams</text>
      <text x="330" y="500" text-anchor="middle" class="c-val" style="font-size:46px">286 525</text>
      <line x1="330" y1="552" x2="330" y2="576" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5"/>
    </g>
    <!-- floors: lines + entry text lines (accent) -->
    <g stroke="var(--ink)" stroke-width="2">
      <g class="floorrow" style="animation-delay:1s"><line x1="144" y1="760" x2="516" y2="760"/>
        <g fill="var(--accent)"><rect x="170" y="778" width="150" height="5"/><rect x="170" y="792" width="220" height="5"/><rect x="350" y="778" width="120" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.08s"><line x1="144" y1="840" x2="516" y2="840"/>
        <g fill="var(--accent)"><rect x="170" y="858" width="190" height="5"/><rect x="170" y="872" width="140" height="5"/><rect x="340" y="858" width="130" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.16s"><line x1="144" y1="920" x2="516" y2="920"/>
        <g fill="var(--accent)"><rect x="170" y="938" width="130" height="5"/><rect x="170" y="952" width="230" height="5"/><rect x="430" y="938" width="40" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.24s"><line x1="144" y1="1000" x2="516" y2="1000"/>
        <g fill="var(--accent)"><rect x="170" y="1018" width="210" height="5"/><rect x="170" y="1032" width="120" height="5"/><rect x="320" y="1018" width="150" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.32s"><line x1="144" y1="1080" x2="516" y2="1080"/>
        <g fill="var(--accent)"><rect x="170" y="1098" width="160" height="5"/><rect x="170" y="1112" width="200" height="5"/><rect x="400" y="1098" width="70" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.4s"><line x1="144" y1="1160" x2="516" y2="1160"/>
        <g fill="var(--accent)"><rect x="170" y="1178" width="140" height="5"/><rect x="170" y="1192" width="180" height="5"/><rect x="380" y="1178" width="90" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.48s"><line x1="144" y1="1240" x2="516" y2="1240"/>
        <g fill="var(--accent)"><rect x="170" y="1258" width="200" height="5"/><rect x="170" y="1272" width="110" height="5"/><rect x="310" y="1258" width="160" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.56s"><line x1="144" y1="1320" x2="516" y2="1320"/>
        <g fill="var(--accent)"><rect x="170" y="1338" width="120" height="5"/><rect x="170" y="1352" width="220" height="5"/><rect x="420" y="1338" width="50" height="5"/></g></g>
      <g class="floorrow" style="animation-delay:1.64s"><line x1="144" y1="1400" x2="516" y2="1400"/></g>
    </g>
    <!-- stair -->
    <g class="draw" style="animation-delay:1.5s">
      <path d="M 152 1390 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20 h 22 v -20" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="3"/>
    </g>
    <!-- floor ruler -->
    <g class="fadeup" style="animation-delay:1.7s">
      <line x1="94" y1="700" x2="94" y2="1400" stroke="var(--line-dim)" stroke-width="2"/>
      <line x1="86" y1="700" x2="102" y2="700" stroke="var(--line-dim)" stroke-width="2"/>
      <line x1="86" y1="1400" x2="102" y2="1400" stroke="var(--line-dim)" stroke-width="2"/>
      <text transform="translate(76 1050) rotate(-90)" text-anchor="middle" class="c-dim">9 этажей</text>
    </g>

    <!-- ground -->
    <g class="draw" style="animation-delay:.6s">
      <line x1="60" y1="1400" x2="1020" y2="1400" pathLength="1" stroke="var(--ink)" stroke-width="5"/>
    </g>
    <g class="floorrow" style="animation-delay:1.2s"><rect x="60" y="1408" width="960" height="14" fill="var(--floor)"/></g>

    <!-- right: register table of the other four -->
    <g class="fadeup" style="animation-delay:1.8s">
      <rect x="600" y="1466" width="420" height="56" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <text x="620" y="1502" class="c-dim" style="font-size:14px">ведомость этажей соседних домов</text>
    </g>
    <g class="fadeup" style="animation-delay:1.9s">
      <rect x="600" y="1522" width="420" height="72" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="616" y="1544" width="118" height="28" fill="var(--floor)" stroke="var(--ink)" stroke-width="2"/>
      <text x="750" y="1550" class="c-name">Малый Петербургский словарь</text>
      <text x="750" y="1582" class="c-val" style="font-size:24px">170 556</text>
    </g>
    <g class="fadeup" style="animation-delay:2s">
      <rect x="600" y="1594" width="420" height="72" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="616" y="1616" width="85" height="28" fill="var(--floor)" stroke="var(--ink)" stroke-width="2"/>
      <text x="750" y="1622" class="c-name">Большой Петербургский словарь</text>
      <text x="750" y="1654" class="c-val" style="font-size:24px">123 366</text>
    </g>
    <g class="fadeup" style="animation-delay:2.1s">
      <rect x="600" y="1666" width="420" height="72" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="616" y="1688" width="63" height="28" fill="var(--floor)" stroke="var(--ink)" stroke-width="2"/>
      <text x="750" y="1694" class="c-name">Apte Practical (rev.)</text>
      <text x="750" y="1726" class="c-val" style="font-size:24px">90 847</text>
    </g>
    <g class="fadeup" style="animation-delay:2.2s">
      <rect x="600" y="1738" width="420" height="72" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="616" y="1760" width="35" height="28" fill="var(--floor)" stroke="var(--ink)" stroke-width="2"/>
      <text x="750" y="1766" class="c-name">vcp</text>
      <text x="750" y="1798" class="c-val" style="font-size:24px">50 135</text>
    </g>

    <!-- left bottom: MW share gauge -->
    <g class="fadeup" style="animation-delay:2.3s">
      <text x="60" y="1470" class="c-dim" style="font-size:14px">доля MW от всех статей</text>
      <text x="60" y="1560" class="c-val" style="font-size:52px">19,0 %</text>
      <rect x="60" y="1590" width="460" height="18" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="63" y="1593" width="87.4" height="12" fill="var(--accent)"/>
      <text x="60" y="1650" class="c-dim" style="font-size:13px">286 525 из 1 506 452 статей</text>
    </g>

    <!-- bottom links + stamp line -->
    <a href="https://github.com/sanskrit-lexicon/csl-orig" target="_blank" rel="noopener">
      <g class="fadeup" style="animation-delay:2.4s">
        <rect x="600" y="1826" width="200" height="40" fill="transparent"/>
        <text x="600" y="1854" class="c-dim">→ csl-orig · 45 словарей</text>
      </g>
    </a>
    <a href="https://github.com/drdhaval2785/SanskritSpellCheck" target="_blank" rel="noopener">
      <g class="fadeup" style="animation-delay:2.5s">
        <rect x="820" y="1826" width="200" height="40" fill="transparent"/>
        <text x="820" y="1854" class="c-dim">→ 431 596 заголовков</text>
      </g>
    </a>
    <g class="fadeup" style="animation-delay:2.6s">
      <text x="60" y="1706" class="c-dim" style="font-size:13px">разрез № 1 · словарный квартал</text>
      <text x="60" y="1734" class="c-dim" style="font-size:13px">посчитано 28.08.2026 · масштаб 1:1</text>
    </g>
  </svg>
  <div class="kicker">Санскритский архив Гасунса · словарный квартал</div>
  <h1>Сколько слов в санскрите?</h1>
  <div class="hero">
    <div class="hero-num">1 506 452</div>
    <div class="hero-label">словарных статей в 45 оцифрованных словарях</div>
    <div class="hero-sub">от кёльнских сканов до связанных данных</div>
  </div>
</div>
</body>
</html>
