<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сколько слов в санскрите? — таблица</title>
<!-- Style: antiquarian naturalist plate. Telegram story 1080x1920. RU-only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper:#F2E9D5; --paper-2:#EDE1C8; --ink:#3A3226; --ink-soft:rgba(58,50,38,.65);
  --accent:#8A4B2C;
  --font-display:'Cormorant Garamond',serif; --font-body:'PT Serif',serif;
}
html, body { background: var(--paper-2); }
body { width: 1080px; font-family: var(--font-body); color: var(--ink); }
.canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 70%); }
.scene { position: absolute; inset: 0; }
svg text { font-family: var(--font-body); }
.n-kick { font: 700 15px var(--font-body); letter-spacing: .3em; text-transform: uppercase; fill: var(--ink-soft); }
.n-title { font: italic 500 30px var(--font-display); fill: var(--ink); }
.n-h1 { font: 700 78px var(--font-display); fill: var(--ink); }
.n-cap { font: italic 500 23px var(--font-display); fill: var(--ink); }
.n-num { font: 600 34px var(--font-display); fill: var(--ink); }
.n-fig { font: 700 16px var(--font-body); letter-spacing: .06em; fill: var(--ink-soft); }
.n-small { font: 400 17px var(--font-body); fill: var(--ink); }
.n-tiny { font: 700 13px var(--font-body); letter-spacing: .18em; text-transform: uppercase; fill: var(--ink-soft); }
.fadeup { opacity: 0; animation: fadeup .55s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.fade { opacity: 0; animation: fadein .6s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.hdr { animation: fadeup .6s ease-out backwards .1s; }
.h1a { animation: fadeup .7s ease-out backwards .25s; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="scene" viewBox="0 0 1080 1920" width="1080" height="1920">
    <defs>
      <pattern id="hatch-n" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
        <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(58,50,38,.5)" stroke-width="1.4"/>
      </pattern>

    <!-- plate frame: double rule + corner diamonds -->
    <g class="fade" style="animation-delay:.05s">

      </g>
    </g>

    <!-- header -->
    <g class="hdr">
      <text x="540" y="140" text-anchor="middle" class="n-kick">Санскритский архив Гасунса · словарный квартал</text>
      <line x1="200" y1="164" x2="880" y2="164" stroke="var(--ink)" stroke-width="1.2"/>
      <path d="M 540 156 l 9 9 l -9 9 l -9 -9 Z" fill="var(--ink)"/>
      <text x="540" y="204" text-anchor="middle" class="n-title">Таблица I. Пять главных словарей, изображённые в масштабе</text>

      <text x="120" y="396" class="n-h1">в санскрите?</text>
      <text x="120" y="466" class="n-small" style="font-size:21px; font-style:italic">1 506 452 словарных статей в 45 оцифрованных словарях —</text>
      <text x="120" y="500" class="n-small" style="font-size:21px; font-style:italic">от кёльнских сканов до связанных данных.</text>
      <g>
        <circle cx="920" cy="170" r="44" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
        <text x="920" y="164" text-anchor="middle" class="n-fig" style="font-size:15px">ТАБЛ.</text>
        <text x="920" y="190" text-anchor="middle" class="n-fig" style="font-size:19px">I</text>

    <!-- ground -->

      <rect x="124" y="1412" width="52" height="18" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="130" y="972" width="40" height="440" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>

        <line x1="138" y1="976" x2="138" y2="1410"/><line x1="146" y1="976" x2="146" y2="1410"/>
        <line x1="154" y1="976" x2="154" y2="1410"/><line x1="162" y1="976" x2="162" y2="1410"/>
      </g>
      <rect x="118" y="952" width="64" height="20" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="136" y="1012" width="28" height="380" fill="url(#hatch-n)" opacity=".25"/>
      <text x="150" y="926" text-anchor="middle" class="n-fig">Рис. 1.</text>
      <text x="150" y="880" text-anchor="middle" class="n-num">286 525</text>
      <text x="150" y="906" text-anchor="middle" class="n-cap" style="font-size:19px">Monier-Williams</text>

    <!-- Fig 2 PW h273 top 1157, cx 340 -->
    <g class="fadeup" style="animation-delay:1.05s">

      <rect x="320" y="1157" width="40" height="255" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>
      <g stroke="var(--ink)" stroke-width="1" opacity=".8">

    <!-- Fig 3 PWG h197 top 1233, cx 530 -->
    <g class="fadeup" style="animation-delay:1.2s">

        <line x1="534" y1="1237" x2="534" y2="1410"/><line x1="542" y1="1237" x2="542" y2="1410"/>

      <text x="530" y="1187" text-anchor="middle" class="n-fig">Рис. 3.</text>
      <text x="530" y="1141" text-anchor="middle" class="n-num" style="font-size:30px">123 366</text>
      <text x="530" y="1167" text-anchor="middle" class="n-cap" style="font-size:18px">Большой Петербургский словарь</text>
    </g>
    <!-- Fig 4 AP h145 top 1285, cx 720 -->
    <g class="fadeup" style="animation-delay:1.35s">
      <rect x="694" y="1412" width="52" height="18" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="700" y="1285" width="40" height="127" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>

        <line x1="724" y1="1289" x2="724" y2="1410"/><line x1="732" y1="1289" x2="732" y2="1410"/>
      </g>
      <rect x="688" y="1265" width="64" height="20" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="726" y="1325" width="28" height="85" fill="url(#hatch-n)" opacity=".25"/>
      <text x="720" y="1239" text-anchor="middle" class="n-fig">Рис. 4.</text>
      <text x="720" y="1193" text-anchor="middle" class="n-num" style="font-size:30px">90 847</text>
      <text x="720" y="1219" text-anchor="middle" class="n-cap" style="font-size:18px">Apte Practical (rev.)</text>
    </g>
    <!-- Fig 5 VCP h80 top 1350, cx 910 -->
    <g class="fadeup" style="animation-delay:1.5s">
      <rect x="884" y="1412" width="52" height="18" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="890" y="1350" width="40" height="62" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>
      <g stroke="var(--ink)" stroke-width="1" opacity=".8">
        <line x1="898" y1="1354" x2="898" y2="1410"/><line x1="906" y1="1354" x2="906" y2="1410"/>
        <line x1="914" y1="1354" x2="914" y2="1410"/><line x1="922" y1="1354" x2="922" y2="1410"/>
      </g>
      <rect x="878" y="1330" width="64" height="20" fill="var(--paper)" stroke="var(--ink)" stroke-width="2.5"/>

      <text x="910" y="1258" text-anchor="middle" class="n-num" style="font-size:30px">50 135</text>
      <text x="910" y="1284" text-anchor="middle" class="n-cap" style="font-size:18px">vcp</text>

    <!-- magnifier: MW share -->
    <g class="fadeup" style="animation-delay:1.7s">
      <circle cx="300" cy="700" r="86" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="300" cy="700" r="74" fill="none" stroke="var(--ink)" stroke-width="1"/>
      <text x="300" y="672" text-anchor="middle" class="n-cap" style="font-size:20px">доля MW</text>
      <text x="300" y="722" text-anchor="middle" class="n-num" style="font-size:44px">19,0 %</text>
      <text x="300" y="752" text-anchor="middle" class="n-small" style="font-size:15px">от всех статей</text>
      <line x1="256" y1="772" x2="180" y2="860" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- description block -->
    <g class="fadeup" style="animation-delay:1.9s">
      <line x1="90" y1="1530" x2="990" y2="1530" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="90" y="1580" class="n-tiny">Описание.</text>
      <text x="90" y="1626" class="n-small" style="font-size:20px">Пять словарей изображены в одном масштабе: высота стелы отвечает</text>
      <text x="90" y="1660" class="n-small" style="font-size:20px">числу словарных статей. Полное собрание квартала — 45 словарей,</text>
      <text x="90" y="1694" class="n-small" style="font-size:20px">1 506 452 статьи; уникальных заголовков — 431 596.</text>
    </g>
    <g class="fadeup" style="animation-delay:2.1s">
      <line x1="90" y1="1730" x2="990" y2="1730" stroke="var(--ink)" stroke-width="1.2"/>

</html>
