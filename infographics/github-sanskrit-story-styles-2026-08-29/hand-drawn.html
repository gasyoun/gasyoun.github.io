<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сколько слов в санскрите? — от руки</title>
<!-- Style: hand-drawn sketchbook. Telegram story 1080x1920. RU-only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Neucha&family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper:#FBF6EC; --ink:#2A2A33; --blue:#3A6FD8; --red:#E2574C; --green:#3E9B63; --tape:rgba(240,214,120,.6);
  --font-hand:'Neucha',cursive; --font-body:'Nunito',sans-serif;
}
html, body { background: var(--paper); }
body { width: 1080px; font-family: var(--font-body); color: var(--ink); }
.canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, transparent 0 33px, rgba(58,111,216,.14) 33px 34px),
    var(--paper); }
.marginline { position: absolute; left: 92px; top: 0; bottom: 0; width: 2px; background: rgba(226,87,76,.4); }
.scene { position: absolute; inset: 0; }
.kicker { position: absolute; left: 128px; top: 108px; font: 700 19px/1.3 var(--font-hand);
  letter-spacing: .08em; color: rgba(42,42,51,.65); transform: rotate(-2deg); }
h1 { position: absolute; left: 124px; top: 146px; width: 860px; font-family: var(--font-hand);
  font-weight: 400; font-size: 92px; line-height: 1.06; transform: rotate(-2deg); }
h1 em { font-style: normal; color: var(--red); }
.hero { position: absolute; left: 128px; top: 396px; transform: rotate(-1.5deg); }
.hero-num { font-family: var(--font-hand); font-size: 84px; line-height: 1; color: var(--blue); }
.hero-label { margin-top: 4px; font: 600 24px/1.3 var(--font-hand); }
.hero-sub { font: 400 19px/1.3 var(--font-hand); color: rgba(42,42,51,.65); }
svg text { font-family: var(--font-hand); }
.h-name { font: 400 26px var(--font-hand); fill: var(--ink); }
.h-val { font: 400 52px var(--font-hand); fill: var(--ink); }
.h-cap { font: 400 24px var(--font-hand); fill: rgba(42,42,51,.7); }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fadeup { opacity: 0; animation: fadeup .5s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.fade { opacity: 0; animation: fadein .5s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.kicker { animation: fadeup .5s ease-out backwards .1s; }
h1 { animation: fadeup .6s ease-out backwards .2s; }
.hero-num { animation: fadeup .6s ease-out backwards .35s; }
.hero-label { animation: fadeup .5s ease-out backwards .5s; }
.hero-sub { animation: fadeup .5s ease-out backwards .6s; }
</style>
</head>
<body>
<div class="canvas">
  <div class="marginline"></div>
  <svg class="scene" viewBox="0 0 1080 1920" width="1080" height="1920">
    <!-- tape corners -->
    <g class="fade" style="animation-delay:.1s">
      <rect x="30" y="26" width="150" height="42" fill="var(--tape)" transform="rotate(-8 30 26)"/>
      <rect x="920" y="30" width="140" height="40" fill="var(--tape)" transform="rotate(6 920 30)"/>
    </g>

    <!-- sun scribble -->
    <g class="fade" style="animation-delay:.4s" stroke="#E8A13C" stroke-width="5" fill="none" stroke-linecap="round">
      <circle cx="930" cy="180" r="42" fill="#F4C878" opacity=".85"/>
      <path d="M 930 108 q 4 -14 -4 -22 M 974 136 q 12 -8 22 -4 M 988 180 q 14 2 18 12 M 968 226 q 8 12 4 20 M 900 224 q -6 14 2 22 M 878 138 q -12 -6 -20 0"/>
    </g>
    <!-- bird -->
    <path class="draw" style="animation-delay:.6s" d="M 700 250 q 16 -20 32 0 q 16 -20 32 0" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>

    <!-- ===== five wobbly houses on ground 1560 ===== -->

    <g class="draw" style="animation-delay:.8s">

      <path d="M 112 926 q 108 -58 222 -4 q -110 -36 -222 4 Z" fill="rgba(226,87,76,.15)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>

      <rect x="246" y="990" width="38" height="30" fill="none" stroke="var(--ink)" stroke-width="4" rx="4"/>
      <rect x="152" y="1090" width="38" height="30" fill="none" stroke="var(--ink)" stroke-width="4" rx="4"/>
      <rect x="246" y="1090" width="38" height="30" fill="none" stroke="var(--ink)" stroke-width="4" rx="4"/>
      <rect x="196" y="1430" width="60" height="128" fill="none" stroke="var(--ink)" stroke-width="5" rx="6"/>

      <text x="225" y="856" text-anchor="middle" class="h-val">286 525</text>
      <text x="225" y="894" text-anchor="middle" class="h-cap" style="font-size:22px">Monier-Williams</text>
      <path d="M 224 908 q 4 12 1 22" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- PW x 380-550 h 380 top 1180 -->
    <g class="draw" style="animation-delay:1s">
      <path d="M 382 1558 q -4 -200 2 -378 q 84 -6 166 0 q -2 190 2 378" fill="rgba(62,155,99,.08)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
      <path d="M 372 1184 q 88 -34 188 -2 q -94 -22 -188 2 Z" fill="rgba(62,155,99,.25)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
    </g>
    <g class="fadeup" style="animation-delay:1.3s">
      <text x="465" y="1128" text-anchor="middle" class="h-val" style="font-size:44px">170 556</text>
      <text x="465" y="1162" text-anchor="middle" class="h-cap" style="font-size:20px">Малый Петербургский словарь</text>
    </g>
    <!-- PWG x 600-740 h 276 top 1284 -->
    <g class="draw" style="animation-delay:1.15s">
      <path d="M 602 1558 q -4 -160 2 -274 q 68 -4 136 0 q -2 140 2 274" fill="rgba(255,178,66,.12)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
      <path d="M 592 1288 q 74 -26 158 -2 q -80 -16 -158 2 Z" fill="rgba(255,178,66,.35)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
    </g>
    <g class="fadeup" style="animation-delay:1.4s">

      <text x="670" y="1276" text-anchor="middle" class="h-cap" style="font-size:18px">Большой Петербургский</text>
    </g>
    <!-- AP x 790-900 h 204 top 1356 -->
    <g class="draw" style="animation-delay:1.3s">

      <path d="M 784 1360 q 58 -20 124 -2 q -62 -12 -124 2 Z" fill="rgba(58,111,216,.18)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>

      <text x="845" y="1348" text-anchor="middle" class="h-cap" style="font-size:16px">Apte (rev.)</text>
    </g>
    <!-- VCP x 940-1020 h 112 top 1448 -->
    <g class="draw" style="animation-delay:1.45s">
      <path d="M 942 1558 q -2 -64 2 -110 q 38 -2 76 0 q -2 56 2 110" fill="rgba(226,87,76,.08)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
      <path d="M 934 1452 q 42 -14 96 -2 q -48 -8 -96 2 Z" fill="rgba(226,87,76,.2)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
    </g>
    <g class="fadeup" style="animation-delay:1.6s">
      <text x="980" y="1418" text-anchor="middle" class="h-val" style="font-size:28px">50 135</text>
      <text x="980" y="1442" text-anchor="middle" class="h-cap" style="font-size:16px">vcp</text>
    </g>

    <!-- ground scribble -->
    <g class="draw" style="animation-delay:.9s">
      <path d="M 70 1560 q 240 10 480 2 q 260 -8 460 4" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" pathLength="1"/>
      <path d="M 90 1580 q 230 8 460 2 q 250 -6 440 6" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" opacity=".5" pathLength="1"/>
    </g>

    <!-- share arrow note -->
    <g class="fadeup" style="animation-delay:1.75s">
      <text x="408" y="906" class="h-cap" style="font-size:26px" fill="var(--red)">19,0 % всех статей!</text>
      <path d="M 400 928 Q 350 952 322 952" fill="none" stroke="var(--red)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 322 952 l 20 -10 l -4 20 Z" fill="var(--red)"/>
    </g>

    <!-- bottom hand box -->
    <g class="draw" style="animation-delay:1.85s">
      <path d="M 110 1660 q -8 -14 8 -16 q 420 -10 850 -2 q 16 0 10 16 q 8 96 -2 168 q -428 12 -856 2 q -14 -84 -10 -168 Z"
        fill="rgba(240,214,120,.25)" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" pathLength="1"/>
    </g>
    <g class="fadeup" style="animation-delay:2s">
      <text x="540" y="1722" text-anchor="middle" class="h-val" style="font-size:54px">и это только один квартал!</text>
      <text x="540" y="1766" text-anchor="middle" class="h-cap" style="font-size:24px">словарных статей · 45 словарей · 431 596 уникальных заголовков</text>
      <a href="https://github.com/sanskrit-lexicon/csl-orig" target="_blank" rel="noopener">
        <text x="540" y="1806" text-anchor="middle" class="h-cap" style="font-size:22px" fill="var(--blue)">→ csl-orig · SanskritSpellCheck</text>
      </a>
    </g>
    <text class="fade" style="animation-delay:2.2s" x="128" y="1878" font-size="26" fill="rgba(42,42,51,.6)">нарисовано от руки · 28.08.2026 · лист 1/1</text>
  </svg>
  <div class="kicker">Санскритский архив Гасунса · словарный квартал</div>
  <h1>Сколько слов <em>в санскрите?</em></h1>
  <div class="hero">
    <div class="hero-num">итого: 1 506 452</div>
    <div class="hero-label">словарных статей в 45 оцифрованных словарях</div>
    <div class="hero-sub">от кёльнских сканов до связанных данных</div>
  </div>
</div>
</body>
</html>
