<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сколько слов в санскрите? — парк</title>
<!-- Style: travel park poster. Telegram story 1080x1920. RU-only. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green-deep:#274D33; --green:#8FB569; --green-dark:#2E5D3A;
  --cream:#F3EAD3; --trunk:#6B4A2E; --accent:#E07A3F; --ink:#22301F;
  --font-head:'Oswald',sans-serif; --font-body:'Nunito',sans-serif;
}
html, body { background: var(--green-deep); }
body { width: 1080px; font-family: var(--font-body); color: var(--cream); }
.canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--green-deep); }
.scene { position: absolute; inset: 0; }
.kicker { position: absolute; left: 64px; top: 120px; font: 600 15px/1.3 var(--font-body);
  text-transform: uppercase; letter-spacing: .18em; color: rgba(243,234,211,.75); }
h1 { position: absolute; left: 64px; top: 156px; width: 760px; font-family: var(--font-head);
  font-weight: 700; font-size: 88px; line-height: 1.04; text-transform: uppercase; color: var(--cream); }
.ribbon { position: absolute; left: 64px; top: 420px; transform: rotate(-2deg);
  background: var(--cream); color: var(--ink); border-radius: 10px; padding: 20px 30px 18px; }
.ribbon-num { font-family: var(--font-head); font-weight: 700; font-size: 66px; line-height: 1; }
.ribbon-label { margin-top: 6px; font: 600 21px/1.3 var(--font-body); }
svg text { font-family: var(--font-body); }
.p-name { font: 700 17px var(--font-head); letter-spacing: .04em; text-transform: uppercase; fill: var(--ink); }
.p-val { font: 600 24px var(--font-head); fill: var(--ink); }
.p-cap { font: 600 13px var(--font-body); letter-spacing: .12em; text-transform: uppercase; fill: rgba(243,234,211,.8); }
.pop { opacity: 0; transform: scale(.5); transform-box: fill-box; transform-origin: 50% 100%;
  animation: pop .55s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes pop { to { opacity: 1; transform: scale(1); } }
.fadeup { opacity: 0; animation: fadeup .5s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.fade { opacity: 0; animation: fadein .6s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.growx { transform: scaleX(0); transform-origin: left center; animation: growx .6s ease-out forwards; }
@keyframes growx { to { transform: scaleX(1); } }
.kicker { animation: fadeup .5s ease-out backwards .1s; }
h1 { animation: fadeup .6s ease-out backwards .2s; }
.ribbon { animation: fadeup .6s ease-out backwards .4s; }
</style>
</head>
