<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ivory:#F7F4EC; --ink:#16150F; --ink-soft:rgba(22,21,15,.6); --hair:rgba(22,21,15,.22); --red:#C0392B;
  --font-display:'Playfair Display',serif; --font-serif:'PT Serif',serif; --font-sans:'PT Sans',sans-serif;
}
html, body { background: var(--ivory); }
body { width: 1080px; font-family: var(--font-serif); color: var(--ink); }
.canvas { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ivory); }
.scene { position: absolute; inset: 0; }
.issue { position: absolute; left: 64px; right: 64px; top: 92px; display: flex; justify-content: space-between;
  font: 700 14px/1 var(--font-sans); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-soft);
  border-top: 3px solid var(--ink); border-bottom: 1px solid var(--hair); padding: 14px 2px 12px; }
h1 { position: absolute; left: 64px; top: 168px; width: 950px; font-family: var(--font-display);
  font-weight: 800; font-size: 108px; line-height: 1.04; letter-spacing: -.01em; }
.standfirst { position: absolute; left: 64px; top: 520px; width: 880px;
  font: italic 400 26px/1.5 var(--font-serif); color: var(--ink); }
.standfirst::first-letter { font-family: var(--font-display); font-weight: 700; font-size: 74px;
  float: left; line-height: .82; padding: 8px 14px 0 0; color: var(--red); }
svg text { font-family: var(--font-serif); }
.e-cap { font: 700 14px var(--font-sans); letter-spacing: .16em; text-transform: uppercase; fill: var(--ink-soft); }
.e-val { font: 600 40px var(--font-display); fill: var(--ink); }
.e-name { font: 700 15px var(--font-sans); letter-spacing: .1em; text-transform: uppercase; fill: var(--ink); }
.e-note { font: italic 400 19px var(--font-serif); fill: var(--ink-soft); }
.fadeup { opacity: 0; animation: fadeup .55s ease-out forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.growx { transform: scaleX(0); transform-origin: left center; animation: growx .7s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes growx { to { transform: scaleX(1); } }
.fade { opacity: 0; animation: fadein .6s ease-out forwards; }
@keyframes fadein { to { opacity: 1; } }
.issue { animation: fadein .6s ease-out backwards .05s; }
h1 { animation: fadeup .7s ease-out backwards .15s; }
.standfirst { animation: fadeup .6s ease-out backwards .35s; }
</style>
</head>
<body>

  </svg>
  <div class="issue"><span>Санскритский архив Гасунса</span><span>Выпуск I · 28.08.2026</span></div>
  <h1>Сколько слов в&nbsp;санскрите?</h1>
  <p class="standfirst">Пять главных словарей квартала, измеренные числом статей: от двухсот восьмидесяти шести с половиной тысяч у Monier-Williams до пятидесяти тысяч у vcp. Высота столбцов — настоящий счёт.</p>
