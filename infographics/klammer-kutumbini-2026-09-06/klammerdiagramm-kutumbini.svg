<svg viewBox="0 0 928 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — karmavyagrakuṭumbinīkucataṭasvedacchidaḥ</title>
<desc>German-Indological bracket diagram of the six-member LEFT-nested compound karma-vyagra-kuṭumbinī-kucataṭa-sveda-cchidaḥ (Amaru-śataka): A = karma+vyagra (busy with her duties), B = [A]+kuṭumbinī (the housewife busy with her duties), C = [B]+kuca (the breast of that housewife), D = [C]+taṭa (the slope of that breast), E = [D]+sveda (the sweat of that slope), F = [E]+chidaḥ (the cutter of that sweat) — the epithet of the monsoon drops (payobindavaḥ) in the verse. II часть begins at cchidaḥ (head). Segmentation confirmed by the DharmaMitra layer (kosha data/sandhi).</desc>
<defs>
<pattern id="hatch" width="5.5" height="5.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5.5" stroke="currentColor" stroke-width="0.8"/></pattern>
</defs>
