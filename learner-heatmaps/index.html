  const forgot = Number(D.totals.srs_rating1);
  const total = Number(D.totals.srs_review_logs);
  f2.innerHTML = 'Оценка «забыл» = <b>' + forgot + ' из ' + total + '</b> отзывов (' + (forgot / total * 100).toFixed(0) + '%). Колода-лидер по забыванию подсвечена золотым (rating 1 > 20).';
  s2.appendChild(f2);
  s2.appendChild(trustBlock([
    'источник: srs_review_logs × srs_decks × srs_cards (агрегаты по колодам)',
    'rating 1 = «забыл» (FSRS), стабильность=0 → карта возвращается немедленно',
    'решение, которое читается: колода с высоким «забыл» при большом числе карт = кандидат на разбиение/переформулировку',
    'грамматическая полка: grammar_attempts = ' + esc(String(D.grammar_lane.grammar_attempts)) + ', exercises = ' + esc(String(D.grammar_lane.grammar_exercises)) + ' — ВЕСЬ грамматический контур нулевой (панель ниже)'
  ]));
  app.appendChild(s2);
}
