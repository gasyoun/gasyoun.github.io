<svg xmlns="http://www.w3.org/2000/svg" width="860" height="448" viewBox="0 0 860 448" role="img" aria-label="Pick the fix move by parent type">
<style>
  :root{--fg:#1d232a;--muted:#5a6672;--line:#d8dee4;--code:#f2f5f8;--accent:#0b6bcb;--bad:#a33a1e;--good:#1e7a3f}
  @media (prefers-color-scheme:dark){:root{--fg:#e6eaee;--muted:#98a0a8;--line:#3a4046;--code:#1f2429;--accent:#5ea3e8;--bad:#e08663;--good:#5cc389}}
  text{fill:var(--fg);font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,'Cascadia Mono',monospace}
  .mut{fill:var(--muted)} .acc{fill:var(--accent)} .bad{fill:var(--bad)} .good{fill:var(--good)}
  .ln{stroke:var(--line)} .accl{stroke:var(--accent)} .fgl{stroke:var(--fg)}
  .badl{stroke:var(--bad)} .goodl{stroke:var(--good)}
  .box{fill:var(--code);stroke:var(--line)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="280" y="20" width="300" height="44" rx="7" class="box" stroke-width="1.5"/><text x="430" y="47" class="" font-size="13" text-anchor="middle">the watcher caught a new console</text><line x1="430" y1="64" x2="430" y2="98" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="280" y="98" width="300" height="44" rx="7" class="box" stroke-width="1.5"/><text x="430" y="125" class="" font-size="13" text-anchor="middle" font-weight="600">who is the PARENT?</text><line x1="280" y1="120" x2="190" y2="168" class="fgl" stroke-width="1.6" marker-end="url(#arr)"/><text x="214" y="152" class="mut" font-size="11" text-anchor="end">console-attached</text><rect x="60" y="168" width="280" height="44" rx="7" class="box" stroke-width="1.5"/><text x="76" y="186" class="mut" font-size="12">child inherits its console —</text><text x="76" y="204" class="mut" font-size="12">a flash from here is rare; audit anyway</text><line x1="580" y1="120" x2="670" y2="168" class="fgl" stroke-width="1.6" marker-end="url(#arr)"/><text x="664" y="152" class="mut" font-size="11">console-less host</text><rect x="470" y="168" width="350" height="44" rx="7" class="box" stroke-width="1.5"/><text x="486" y="186" class="" font-size="12">hide it at the call site, every call site:</text><text x="486" y="204" class="mono" font-size="12">CREATE_NO_WINDOW / windowsHide: true</text><line x1="430" y1="142" x2="430" y2="244" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="280" y="244" width="300" height="44" rx="7" class="box" stroke-width="1.5"/><text x="430" y="271" class="" font-size="13" text-anchor="middle" font-weight="600">can you patch that code?</text><line x1="280" y1="266" x2="190" y2="314" class="fgl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40" y="314" width="300" height="44" rx="7" class="box" stroke-width="1.5"/><text x="56" y="332" class="" font-size="12">yes → apply the flag, audit with</text><text x="56" y="349" class="mono" font-size="10.5">grep -rEn &quot;spawn(Sync)?\(|execFile\(|exec\(&quot; .</text><line x1="580" y1="266" x2="670" y2="314" class="fgl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="520" y="314" width="300" height="44" rx="7" class="box" stroke-width="1.5"/><text x="536" y="332" class="" font-size="12">no (third-party) → fix upstream,</text><text x="536" y="349" class="mut" font-size="10.5">or hide with a VBS shim / Start-Process -WindowStyle Hidden</text><line x1="430" y1="358" x2="430" y2="384" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="230" y="384" width="400" height="44" rx="7" class="" stroke-width="1.8" stroke="var(--good)"/><text x="430" y="402" class="good" font-size="12.5" text-anchor="middle" font-weight="600">re-run the canary + 15-min watch</text><text x="430" y="419" class="mut" font-size="11" text-anchor="middle">the same instruments prove the fix did not revert</text>
</svg>
