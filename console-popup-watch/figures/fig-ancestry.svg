.exe</text><text x="56" y="276" class="mut" font-size="11">C:\demo\demo-gui.exe</text><text x="700" y="92" class="mut" font-size="11.5">walk up the</text><text x="700" y="108" class="mut" font-size="11.5">chain until the</text><text x="700" y="124" class="mut" font-size="11.5">launcher that</text><text x="700" y="140" class="mut" font-size="11.5">owns the spawn</text>
</svg>
