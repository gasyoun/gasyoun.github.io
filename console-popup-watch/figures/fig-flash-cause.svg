<svg xmlns="http://www.w3.org/2000/svg" width="860" height="336" viewBox="0 0 860 336" role="img" aria-label="Why the 1-second console flash happens">
<style>
  :root{--fg:#1d232a;--muted:#5a6672;--line:#d8dee4;--code:#f2f5f8;--accent:#0b6bcb;--bad:#a33a1e;--good:#1e7a3f}
  @media (prefers-color-scheme:dark){:root{--fg:#e6eaee;--muted:#98a0a8;--line:#3a4046;--code:#1f2429;--accent:#5ea3e8;--bad:#e08663;--good:#5cc389}}
  text{fill:var(--fg);font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,'Cascadia Mono',monospace}
  .mut{fill:var(--muted)} .acc{fill:var(--accent)} .bad{fill:var(--bad)} .good{fill:var(--good)}
  .ln{stroke:var(--line)} .accl{stroke:var(--accent)} .fgl{stroke:var(--fg)}
  .badl{stroke:var(--bad)} .goodl{stroke:var(--good)}
  .box{fill:var(--code);stroke:var(--line)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="24" y="34" class="acc" font-size="14" font-weight="600">A · parent already has a console</text><rect x="24" y="52" width="250" height="64" rx="7" class="box" stroke-width="1.5"/><text x="40" y="78" class="mono" font-size="12">demo-shell.exe</text><text x="40" y="98" class="mut" font-size="12">owns a console window</text><line x1="282" y1="84" x2="360" y2="84" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="368" y="52" width="220" height="64" rx="7" class="box" stroke-width="1.5"/><text x="384" y="78" class="mono" font-size="12">console child (probe.exe)</text><text x="384" y="98" class="mut" font-size="12">inherits parent console</text><text x="604" y="90" class="good" font-size="12" font-weight="600">child reuses the parent's</text><text x="604" y="108" class="good" font-size="12" font-weight="600">console — nothing on screen</text><line x1="24" y1="150" x2="836" y2="150" class="ln" stroke-width="1.5"/><text x="24" y="186" class="acc" font-size="14" font-weight="600">B · parent has NO console</text><rect x="24" y="204" width="250" height="64" rx="7" class="box" stroke-width="1.5"/><text x="40" y="230" class="mono" font-size="12">GUI host / pythonw / service</text><text x="40" y="250" class="mut" font-size="12">has no console at all</text><line x1="282" y1="236" x2="360" y2="236" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="368" y="204" width="220" height="64" rx="7" class="box" stroke-width="1.5"/><text x="384" y="230" class="mono" font-size="12">console child (probe.exe)</text><text x="384" y="250" class="mut" font-size="12">Windows allocates a console</text><line x1="596" y1="236" x2="674" y2="236" class="badl" stroke-width="1.6" marker-end="url(#arr)"/><rect x="682" y="204" width="150" height="64" rx="7" class="" stroke-width="1.8" stroke="var(--bad)"/><text x="697" y="230" class="bad" font-size="12" font-weight="600">visible 1-second</text><text x="697" y="250" class="bad" font-size="12" font-weight="600">flash on screen</text><text x="24" y="302" class="mut" font-size="12">Every console-subsystem child gets a console — the only question is whose:</text><text x="24" y="320" class="mut" font-size="12">inherited (invisible) or freshly allocated (the flash the watcher records).</text>
</svg>
