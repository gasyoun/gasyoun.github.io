<svg xmlns="http://www.w3.org/2000/svg" width="860" height="262" viewBox="0 0 860 262" role="img" aria-label="The JSONL receipt, field by field">
<style>
  :root{--fg:#1d232a;--muted:#5a6672;--line:#d8dee4;--code:#f2f5f8;--accent:#0b6bcb;--bad:#a33a1e;--good:#1e7a3f}
  @media (prefers-color-scheme:dark){:root{--fg:#e6eaee;--muted:#98a0a8;--line:#3a4046;--code:#1f2429;--accent:#5ea3e8;--bad:#e08663;--good:#5cc389}}
  text{fill:var(--fg);font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,'Cascadia Mono',monospace}
  .mut{fill:var(--muted)} .acc{fill:var(--accent)} .bad{fill:var(--bad)} .good{fill:var(--good)}
  .ln{stroke:var(--line)} .accl{stroke:var(--accent)} .fgl{stroke:var(--fg)}
  .badl{stroke:var(--bad)} .goodl{stroke:var(--good)}
  .box{fill:var(--code);stroke:var(--line)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="24" y="26" class="" font-size="14" font-weight="600">one receipts line, dissected</text><text x="836" y="26" class="mut" font-size="11" text-anchor="end">feed: demo/before.jsonl</text><text x="24" y="64" class="mono" font-size="11.5" fill="var(--fg)">{&quot;utc&quot;: &quot;2026-11-18T16:02:41.310000+00:00&quot;, &quot;type&quot;: &quot;new_visible_window&quot;, &quot;elapsed_s&quot;: 41.31, &quot;pid&quot;: 441</text><text x="24" y="79" class="mono" font-size="11.5" fill="var(--fg)">10, &quot;class&quot;: &quot;ConsoleWindowClass&quot;, &quot;title&quot;: &quot;C:\\tools\\probe.exe&quot;, &quot;ancestry&quot;: [{&quot;pid&quot;: 44110, &quot;parent&quot;</text><text x="24" y="94" class="mono" font-size="11.5" fill="var(--fg)">: 44102, &quot;process&quot;: &quot;probe.exe&quot;, &quot;cmdline_peb&quot;: &quot;C:\\tools\\probe.exe --tick&quot;}, {&quot;pid&quot;: 44102, &quot;parent&quot;:</text><text x="24" y="109" class="mono" font-size="11.5" fill="var(--fg)"> 44098, &quot;process&quot;: &quot;demo-guard.exe&quot;, &quot;cmdline_peb&quot;: &quot;C:\\demo\\hooks\\demo-guard.exe --event tick&quot;}, {&quot;p</text><text x="24" y="124" class="mono" font-size="11.5" fill="var(--fg)">id&quot;: 44098, &quot;parent&quot;: 44090, &quot;process&quot;: &quot;pythonw.exe&quot;, &quot;cmdline_peb&quot;: &quot;pythonw.exe C:\\demo\\tools\\runn</text><text x="24" y="139" class="mono" font-size="11.5" fill="var(--fg)">er.py&quot;}, {&quot;pid&quot;: 44090, &quot;parent&quot;: 4231, &quot;process&quot;: &quot;demo-gui.exe&quot;, &quot;cmdline_peb&quot;: &quot;C:\\demo\\demo-gui.ex</text><text x="24" y="154" class="mono" font-size="11.5" fill="var(--fg)">e&quot;}]}</text><line x1="340.8" y1="68" x2="340.8" y2="180" class="badl" stroke-width="1.3" stroke-dasharray="3 3"/><text x="347.8" y="187" class="bad" font-size="11.5">type — what happened: a new visible top-level window</text><line x1="556.8000000000001" y1="68" x2="556.8000000000001" y2="200" class="accl" stroke-width="1.3" stroke-dasharray="3 3"/><text x="563.8000000000001" y="207" class="acc" font-size="11.5">elapsed_s — when, inside the watch window</text><line x1="513.6" y1="83" x2="513.6" y2="220" class="goodl" stroke-width="1.3" stroke-dasharray="3 3"/><text x="520.6" y="227" class="good" font-size="11.5">ancestry — parent chain to the launcher, with PEB cmdlines</text>
</svg>
