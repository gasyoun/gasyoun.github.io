<svg xmlns="http://www.w3.org/2000/svg" width="860" height="304" viewBox="0 0 860 304" role="img" aria-label="The 15-minute verification protocol and the 0/0 fork">
<style>
  :root{--fg:#1d232a;--muted:#5a6672;--line:#d8dee4;--code:#f2f5f8;--accent:#0b6bcb;--bad:#a33a1e;--good:#1e7a3f}
  @media (prefers-color-scheme:dark){:root{--fg:#e6eaee;--muted:#98a0a8;--line:#3a4046;--code:#1f2429;--accent:#5ea3e8;--bad:#e08663;--good:#5cc389}}
  text{fill:var(--fg);font-family:system-ui,'Segoe UI',Roboto,sans-serif}
  .mono{font-family:ui-monospace,Consolas,'Cascadia Mono',monospace}
  .mut{fill:var(--muted)} .acc{fill:var(--accent)} .bad{fill:var(--bad)} .good{fill:var(--good)}
  .ln{stroke:var(--line)} .accl{stroke:var(--accent)} .fgl{stroke:var(--fg)}
  .badl{stroke:var(--bad)} .goodl{stroke:var(--good)}
  .box{fill:var(--code);stroke:var(--line)}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="24" y="30" width="176" height="96" rx="7" class="box" stroke-width="1.5"/><text x="38" y="54" class="" font-size="12.5" font-weight="600">0 · baseline + heartbeat</text><text x="38" y="76" class="mut" font-size="11">watch the live desktop;</text><text x="38" y="92" class="mut" font-size="11">30-s heartbeats make a dead</text><text x="38" y="108" class="mut" font-size="11">watcher visible in the log</text><rect x="236" y="30" width="176" height="96" rx="7" class="box" stroke-width="1.5"/><text x="250" y="54" class="" font-size="12.5" font-weight="600">1 · A/B canary (--negctl)</text><text x="250" y="76" class="mut" font-size="11">one control window visible,</text><text x="250" y="92" class="mut" font-size="11">one with CREATE_NO_WINDOW: the</text><text x="250" y="108" class="mut" font-size="11">verdict must read default&gt;0, hidden==0</text><rect x="448" y="30" width="176" height="96" rx="7" class="box" stroke-width="1.5"/><text x="462" y="54" class="" font-size="12.5" font-weight="600">2 · 15-min interception</text><text x="462" y="76" class="mut" font-size="11">≥15 min while the estate</text><text x="462" y="92" class="mut" font-size="11">works. 0 new windows = quiet;</text><text x="462" y="108" class="mut" font-size="11">any window = a named lead</text><rect x="660" y="30" width="176" height="96" rx="7" class="box" stroke-width="1.5"/><text x="674" y="54" class="" font-size="12.5" font-weight="600">3 · byte-match ×3</text><text x="674" y="76" class="mut" font-size="11">live copy vs deploy copy vs</text><text x="674" y="92" class="mut" font-size="11">repo HEAD (CRLF-normalized),</text><text x="674" y="108" class="mut" font-size="11">run before and after the fix</text><line x1="202" y1="78" x2="234" y2="78" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><line x1="414" y1="78" x2="446" y2="78" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><line x1="626" y1="78" x2="658" y2="78" class="accl" stroke-width="1.6" marker-end="url(#arr)"/><line x1="324" y1="126" x2="324" y2="148" class="accl" stroke-width="1.6"/><rect x="60" y="148" width="400" height="46" rx="7" class="" stroke-width="1.8" stroke="var(--good)"/><text x="76" y="167" class="good" font-size="12" font-weight="600">canary 1/0 · watcher_not_blind: true</text><text x="76" y="184" class="mut" font-size="11">the watcher sees what appears — trust the quiet log</text><line x1="324" y1="194" x2="324" y2="216" class="accl" stroke-width="1.6"/><rect x="60" y="216" width="400" height="46" rx="7" class="" stroke-width="1.8" stroke="var(--bad)"/><text x="76" y="235" class="bad" font-size="12" font-weight="600">canary 0/0 → INCONCLUSIVE, never “clean”</text><text x="76" y="252" class="mut" font-size="11">console-attached shell ate the probe: rerun under pythonw.exe,</text><text x="500" y="160" class="mut" font-size="11.5">…or force a brand-new console from the same shell:</text><text x="500" y="178" class="mono" font-size="11.5">cmd /c start &quot;&quot; cmd /c &quot;ping -n 4 127.0.0.1 &gt;nul&quot;</text><text x="500" y="196" class="mut" font-size="11.5">the new window must be caught, or the watcher is blind.</text><text x="24" y="290" class="mut" font-size="12">Verify after the fix with the same instruments you used before it —</text>
</svg>
