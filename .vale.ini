# Vale — EN-doc prose linting (ADR-0005, H8384). ADVISORY from day one:
# CI reports flag rates and stays green; blocking escalation is a later ruling.
#
# Scope: EN Markdown docs ONLY. RU prose is explicitly OUT of scope — the RU
# voice is never mechanically linted — so every RU-majority or bilingual file
# gets a BasedOnStyles = NONE section below (Cyrillic density, 17-11-2026).
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Estate

# Base: Google developer-documentation style — this repo is public web pages
# (vote hub, estate indexes, published deliverables), not a product doc set.
Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# --- RU-majority / bilingual prose: never linted (ADR-0005) ---
[CHANGELOG.md]
BasedOnStyles = NONE
[README.md]
BasedOnStyles = NONE
[.ai_state.md]
BasedOnStyles = NONE
[panini/README.md]
BasedOnStyles = NONE
[h2582/08_RECOMMENDATIONS_RU.md]
BasedOnStyles = NONE
[smb-pain-benchmark-2026/index.meta.md]
BasedOnStyles = NONE
[fasmer-2026/DECISIONS-2026-09-25.md]
BasedOnStyles = NONE
[zalizniak-2026/DECISIONS-yoga-2026-09-10.md]
BasedOnStyles = NONE
[scripts/campus/MASTERY_DUALRUN_2026-09-14.md]
BasedOnStyles = NONE
# --- agent-internal stores + the vendored styles themselves ---
[.claude/**]
BasedOnStyles = NONE
[.vale/**]
BasedOnStyles = NONE
